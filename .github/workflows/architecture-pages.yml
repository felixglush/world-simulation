name: Architecture canvas

on:
  push:
    branches: [main, codex/architecture-github-pages]
    paths: ['architecture/**', '.github/workflows/architecture-pages.yml']
  pull_request:
    paths: ['architecture/**', '.github/workflows/architecture-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architecture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: architecture/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-offline
          path: architecture/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: architecture/dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/architecture-github-pages')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
